[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-medallion-api"
version = "0.2.0"
description = "API FastAPI para integração medallion PostgreSQL e Databricks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.8,<3",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
local = ["uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4"]
dev = ["httpx>=0.28,<1", "ruff>=0.11,<1"]

[dependency-groups]
dev = ["workers-py==1.17.7", "workers-runtime-sdk==1.9.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


[tool.ruff.lint.per-file-ignores]
"databricks/*.py" = ["F821"] # spark/dbutils are provided by Databricks notebooks.
