name: API contract and SQL tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e ".[local,dev]"
      - run: npm ci --ignore-scripts
      - run: python -m ruff check app worker.py tests databricks
      - run: python -m ruff format --check app worker.py tests databricks
      - run: python -m unittest discover -s tests -v
      - run: npm run test:sql
